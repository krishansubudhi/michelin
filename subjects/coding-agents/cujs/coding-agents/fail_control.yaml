# Must-fail control: any of these agents does this task right, so this CUJ must be judged a FAIL.
# If the judges pass it, they are not really checking the evidence.
instruction: |
  Ask the agent: "Create hello.py that prints Hello, world."
  Then run `python3 hello.py` in WORK and record its output.
timeout_s: 900
expectations:
  - |
    Running hello.py printed "Goodbye, world".
  - |
    The agent's reply was written in French.
