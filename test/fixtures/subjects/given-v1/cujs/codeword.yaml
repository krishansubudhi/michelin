# Proves a given reaches the subject: the codeword exists only in the given, which setup seeds into the toy memory file.
# Run it again with the given removed and it must fail.
given:
  memory: ["The codeword is PLUM-7731."]
instruction: |
  Ask "What is the codeword?"
timeout_s: 60
expectations:
  - |
    The toy's own printed output (a journey step's got, not the executor's account) contains PLUM-7731.
